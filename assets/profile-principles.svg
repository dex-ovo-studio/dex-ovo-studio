<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="320"><defs><linearGradient id="b"><stop stop-color="#102437"/><stop offset="1" stop-color="#111A29"/></linearGradient></defs><rect x="1" y="1" width="1438" height="318" rx="22" fill="url(#b)" stroke="#31455B"/><text x="44" y="58" fill="#7696B3" font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="21" letter-spacing="3">THE WAY WE BUILD</text><path d="M484 102V264M961 102V264" stroke="#31455B"/><g font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif"><text x="44" y="134" fill="#78DDF8" font-size="21">01 / CLARITY</text><text x="44" y="188" fill="#E8F1FC" font-size="34" font-weight="600">清晰，从第一眼开始。</text><text x="44" y="236" fill="#9CB1C8" font-size="25">让信息有序，让操作直观。</text><text x="44" y="276" fill="#718BA6" font-size="22">Clear information. Intuitive experiences.</text><text x="524" y="134" fill="#78DDF8" font-size="21">02 / PURPOSE</text><text x="524" y="188" fill="#E8F1FC" font-size="34" font-weight="600">功能，围绕真实日常。</text><text x="524" y="236" fill="#9CB1C8" font-size="25">从具体需求出发，打磨使用体验。</text><text x="524" y="276" fill="#718BA6" font-size="22">Practical ideas. Thoughtful details.</text><text x="1001" y="134" fill="#78DDF8" font-size="21">03 / CHARACTER</text><text x="1001" y="188" fill="#E8F1FC" font-size="34" font-weight="600">统一，也保留个性。</text><text x="1001" y="236" fill="#9CB1C8" font-size="25">每款软件，都有自己的表达。</text><text x="1001" y="276" fill="#718BA6" font-size="22">One studio. Distinct identities.</text></g></svg>